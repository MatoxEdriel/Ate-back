<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 32px 12px;
    }
    .container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 28px 32px;
      text-align: left;
      border-bottom: 3px solid #ea580c;
    }
    .brand-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
      display: inline-block;
    }
    .brand-dot {
      color: #ea580c;
    }
    .brand-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin: 4px 0 0 0;
    }
    .content {
      padding: 32px;
      line-height: 1.6;
      font-size: 15px;
      color: #334155;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #ea580c;
      text-decoration: none;
    }
    .btn {
      display: inline-block;
      background-color: #ea580c;
      color: #ffffff !important;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .highlight-box {
      background-color: #fff7ed;
      border: 1px solid #ffedd5;
      border-left: 4px solid #ea580c;
      padding: 16px;
      border-radius: 6px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="brand-title">Ate<span class="brand-dot">.</span></h1>
        <p class="brand-subtitle">Plataforma Corporativa de Alimentación</p>
      </div>
      <div class="content">
        {{ content }}
      </div>
      <div class="footer">
        <p style="margin: 0 0 8px 0;">Este es un mensaje automático del sistema <strong>Ate</strong>.</p>
        <p style="margin: 0 0 8px 0;">¿Necesitas soporte? Escríbenos a <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
        <p style="margin: 0; color: #94a3b8;">&copy; {{ year }} Ate Platform. Todos los derechos reservados.</p>
      </div>
    </div>
  </div>
</body>
</html>
