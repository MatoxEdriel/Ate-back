<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F6F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #2B2D2F;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #F8F6F0;
      padding: 32px 12px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #EAE6DF;
      box-shadow: 0 8px 30px rgba(20, 114, 91, 0.06);
    }
    .header {
      padding: 24px 32px 16px;
      text-align: center;
      background-color: #FFFFFF;
    }
    .brand-title {
      color: #14725B;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
      display: inline-block;
    }
    .brand-dot {
      color: #D4A373;
    }
    .content {
      padding: 12px 32px 32px;
      line-height: 1.5;
    }
    .footer {
      background-color: #FAF8F5;
      padding: 20px 32px;
      text-align: center;
      border-top: 1px solid #EAE6DF;
      font-size: 11px;
      color: #8A94A0;
    }
    .footer a {
      color: #14725B;
      text-decoration: none;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      background-color: #14725B;
      color: #FFFFFF !important;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(20, 114, 91, 0.25);
    }
    .highlight-box {
      background-color: #FBF9F5;
      border: 1px solid #EAE4D9;
      border-radius: 12px;
      padding: 16px 20px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="brand-title">Ate<span class="brand-dot">.</span></h1>
      </div>
      <div class="content">
        {{ content }}
      </div>
      <div class="footer">
        <p style="margin: 0 0 4px 0;">Mensaje enviado por <strong>Ate Platform</strong> para colaboradores corporativos.</p>
        <p style="margin: 0;">Soporte: <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
      </div>
    </div>
  </div>
</body>
</html>
