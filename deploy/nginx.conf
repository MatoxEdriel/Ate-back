# Servidor del frontend (Angular compilado en /usr/share/nginx/html) con cabeceras de seguridad.
# Ajusta server_name y la API en connect-src. Los hashes de script-src corresponden a los scripts en
# línea del index.html compilado; si cambian, recalcúlalos (ver docs/security/despliegue.md).
server {
    listen 443 ssl;
    http2 on;
    server_name app.ate.com;

    # ssl_certificate     /etc/ssl/ate/fullchain.pem;
    # ssl_certificate_key /etc/ssl/ate/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-ZCml/NT2wIT6vKKDmqERQOZJS+D/RyrG8Hcj8eOHzV4=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://*.tile.openstreetmap.org; connect-src 'self' https://api.ate.com; frame-src 'self' blob: https://maps.google.com https://www.google.com https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash se pueden cachear mucho tiempo; index.html no.
    location ~* \.(?:js|css|woff2?|png|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

server {
    listen 80;
    server_name app.ate.com;
    return 301 https://$host$request_uri;
}
