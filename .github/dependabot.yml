# Avisa con un PR cuando hay versiones nuevas o parches de seguridad (ISO 27001 A.8.8).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
