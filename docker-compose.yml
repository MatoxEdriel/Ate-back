version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ate_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - postgres_ate_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0
    container_name: ate_mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ate_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Define MONGO_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ate_nosql_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_ate_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ate_backend_api
    restart: always
    ports:
      - "5252:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ate_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__MongoDbConnection=mongodb://ate_admin:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env (32+ caracteres aleatorios)}
    depends_on:
      - postgres
      - mongo

volumes:
  postgres_ate_data:
  mongo_ate_data:
