version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ate_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_ate_data:/var/lib/postgresql/data

volumes:
  postgres_ate_data:
